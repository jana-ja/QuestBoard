name: frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: ./frontend

jobs:
  # Job names must not collide with the backend workflow: required checks are matched by name.
  check-frontend-changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read # Required for dorny/paths-filter to work with pull request events
      contents: read

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      # Checkout of repo needed for dorny/paths-filter to work with push events
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend.yml'

  check-frontend:
    needs: check-frontend-changes
    if: ${{ needs.check-frontend-changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci # ci -> installs exactly from package-lock.json, fails if it does not match package.json

      - name: Lint with oxlint
        run: npm run lint
      - name: Type check with TypeScript
        run: npm run typecheck
      - name: Build with Vite
        run: npm run build
