name: quest_board
services:
  db:
    image: postgres:18
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quest_board}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD environment variable, must be set in infra/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

volumes:
  db_data:
